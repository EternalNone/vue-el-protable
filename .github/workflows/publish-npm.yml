# npm 自动发布：推送 v* 格式的 tag 后自动构建、测试并发布到 npm
# 用法：npm version patch/minor/major 生成 tag，然后 git push --follow-tags
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 签名需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # prepublishOnly 钩子会自动执行 npm run build
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
